# Manual build of a self-contained Windows x64 CUDA binary for this fork.
# Not part of upstream CI, do not merge to ggml-org/llama.cpp.
name: Build Windows CUDA artifact

on:
  workflow_dispatch:

jobs:
  windows-cuda:
    runs-on: windows-2022
    steps:
      - name: Clone
        uses: actions/checkout@v6

      - name: Install Cuda Toolkit
        uses: ./.github/actions/windows-setup-cuda
        with:
          cuda_version: '13.4'
          cuda_arch: x64

      - name: Install Ninja
        run: choco install ninja -y

      - name: Build
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" x64
          cmake -S . -B build -G "Ninja Multi-Config" ^
            -DGGML_NATIVE=OFF ^
            -DGGML_AVX2=ON ^
            -DGGML_FMA=ON ^
            -DGGML_F16C=ON ^
            -DGGML_BMI2=ON ^
            -DGGML_AVX_VNNI=ON ^
            -DGGML_CUDA=ON ^
            -DCMAKE_CUDA_ARCHITECTURES=89-real ^
            -DGGML_CUDA_FA_QUANTS=all ^
            -DGGML_CUDA_GRAPHS=ON ^
            -DGGML_CUDA_COMPRESSION_MODE=speed ^
            -DGGML_CUDA_CCCL_VERSION=v3.4.3 ^
            -DLLAMA_BUILD_BORINGSSL=ON
          set /A NINJA_JOBS=%NUMBER_OF_PROCESSORS%-1
          cmake --build build --config Release -j %NINJA_JOBS%

      - name: Pack artifact
        shell: pwsh
        run: |
          $dst = 'llama-win-cuda'
          # skip pdb files to keep the zip small
          robocopy .\build\bin\Release $dst /XF *.pdb | Out-Null
          # runtime DLLs so the binaries run on machines without CUDA toolkit
          robocopy "${env:CUDA_PATH}\bin" $dst cudart64_*.dll cublas64_*.dll cublasLt64_*.dll | Out-Null
          7z a llama-win-cuda-89-cuda13.4.zip $dst

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: llama-win-cuda-89-cuda13.4
          path: llama-win-cuda-89-cuda13.4.zip
          retention-days: 90
